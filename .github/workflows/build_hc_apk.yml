name: Build HC Export APK

on:
  push:
    paths:
      - 'healthconnect_to_gcal/hc_export_app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Write local.properties
        working-directory: healthconnect_to_gcal/hc_export_app
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        working-directory: healthconnect_to_gcal/hc_export_app
        run: ./gradlew assembleDebug

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HC Sync (latest build)
          files: healthconnect_to_gcal/hc_export_app/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
