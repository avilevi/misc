name: Build HC Export APK

on:
  push:
    paths:
      - 'healthconnect_to_gcal/hc_export_app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_MAJOR: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Write local.properties
        working-directory: healthconnect_to_gcal/hc_export_app
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Decode keystore
        working-directory: healthconnect_to_gcal/hc_export_app/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build release APK
        working-directory: healthconnect_to_gcal/hc_export_app
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_MAJOR: '1'
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease

      - name: Write version.json
        run: |
          echo '{"versionCode":${{ github.run_number }},"versionName":"${{ env.VERSION_MAJOR }}.${{ github.run_number }}","buildDate":"$(date -u +'%Y-%m-%dT%H:%M:%SZ')"}' > version.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HC Sync (build ${{ github.run_number }})
          files: |
            healthconnect_to_gcal/hc_export_app/app/build/outputs/apk/release/app-release.apk
            version.json
          prerelease: true
